# ATR Inventory — Nginx server block (installed to etc/nginx/servers/atr.conf)
# Placeholder __PORT__, __ROOT__, __FPM__ are replaced by install.sh
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;

    root __ROOT__/public;
    index index.php;

    access_log __ROOT__/storage/logs/nginx-access.log;
    error_log __ROOT__/storage/logs/nginx-error.log warn;

    client_max_body_size 50m;
    sendfile on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        try_files $uri /index.php;
    }

    location /uploads/ {
        alias __ROOT__/storage/uploads/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        location ~ \.php$ {
            deny all;
        }
    }

    location /theme/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass __FPM__;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 10s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}
