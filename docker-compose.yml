services:
  app:
    build:
      context: .
      args:
        LLAMA_CPP_TAG: v0.3.0
    image: atr-inventory:latest
    ports:
      - "${ATR_PORT:-8080}:8080"
    environment:
      ATR_DB_HOST: db
      ATR_DB_PORT: "5432"
      ATR_DB_NAME: atr
      ATR_DB_USER: atr
      ATR_DB_PASS: ${ATR_DB_PASS:-atr}
      ATR_ADMIN_PASS: ${ATR_ADMIN_PASS:-}
      ATR_TZ: ${ATR_TZ:-UTC}
    volumes:
      - atr_storage:/var/www/atr/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: atr
      POSTGRES_USER: atr
      POSTGRES_PASSWORD: ${ATR_DB_PASS:-atr}
    volumes:
      - atr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atr -d atr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  atr_storage:
  atr_pgdata:
