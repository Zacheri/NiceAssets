services:
  app:
    build:
      context: .
      args:
        LLAMA_CPP_TAG: v0.3.0
    image: naims:latest
    ports:
      - "${NAIMS_PORT:-8080}:8080"
    environment:
      NAIMS_DB_HOST: db
      NAIMS_DB_PORT: "5432"
      NAIMS_DB_NAME: naims
      NAIMS_DB_USER: naims
      NAIMS_DB_PASS: ${NAIMS_DB_PASS:-naims}
      NAIMS_ADMIN_PASS: ${NAIMS_ADMIN_PASS:-}
      NAIMS_TZ: ${NAIMS_TZ:-UTC}
    volumes:
      - naims_storage:/var/www/naims/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: naims
      POSTGRES_USER: naims
      POSTGRES_PASSWORD: ${NAIMS_DB_PASS:-naims}
    volumes:
      - naims_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naims -d naims"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  naims_storage:
    name: naims_storage
  naims_pgdata:
    name: naims_pgdata
